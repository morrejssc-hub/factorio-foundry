id: factorio-foundry-mvp
description: |
  MVP epoch chain — full red-bottle production line.
  e0 bootstraps; e1-e3 build burner-era resource extraction (coal → iron → copper);
  e4 adds steam power (first electricity); e5 adds gear production (assembling-machine-1);
  e6 produces automation-science-pack (red bottle).
  e7-e9 are test branches (recovery, unreachable, probe-driven).
nodes:
  - id: e0-bootstrap
  - id: e1-first-coal
    depends_on: [e0-bootstrap]
  - id: e2-first-iron
    depends_on: [e1-first-coal]
  - id: e3-first-copper
    depends_on: [e2-first-iron]
  - id: e4-steam-power
    depends_on: [e3-first-copper]
  - id: e5-gear
    depends_on: [e4-steam-power]
  - id: e6-red-bottle
    depends_on: [e5-gear]
  - id: e7-unreachable-iron
    depends_on: [e0-bootstrap]
  - id: e8-probe-driven-design
    depends_on: [e0-bootstrap]
  - id: e9-coal-feeds-iron
    depends_on: [e0-bootstrap]
