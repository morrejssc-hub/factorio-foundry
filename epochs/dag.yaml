id: factorio-foundry-mvp
description: |
  MVP epoch chain. e0 bootstraps; e1/e2/e3 progress factory state on a single
  save chain (coal → iron → copper); e4 branches off e0 to test multi-placement
  with the existing coal-burner-cell. e5 branches off e0 to test MODULE
  CREATION — the Designer authors a new coal-cluster-cell module and the
  pipeline verifies it; on audit pass the module promotes to lib/ for use
  by future epochs. e6 branches off e0 with recovery_attempts: 3 and a
  high-but-reachable threshold to exercise the retry loop (audit-fail →
  re-design with prior-attempt feedback). e7 branches off e0 with an
  UNREACHABLE-by-construction target (asks for iron-ore from a coal-only
  module) — exercises the all-attempts-fail return path. e8 branches off e0
  and requires the Designer to use factorio_read (tile-info, validate-placement)
  instead of pre-computed hints. e9 branches off e0 and exercises inter-module
  belt connections: coal-burner-cell output feeds iron-smelt-line fuel input.
  e5 / e6 / e7 / e8 / e9's saves are orphans (no downstream depends_on).
nodes:
  - id: e0-bootstrap
  - id: e1-first-coal
    depends_on: [e0-bootstrap]
  - id: e2-first-iron
    depends_on: [e1-first-coal]
  - id: e3-first-copper
    depends_on: [e2-first-iron]
  - id: e4-coal-pair
    depends_on: [e0-bootstrap]
  - id: e5-coal-cluster-cell
    depends_on: [e0-bootstrap]
  - id: e6-recovery-test
    depends_on: [e0-bootstrap]
  - id: e7-unreachable-iron
    depends_on: [e0-bootstrap]
  - id: e8-probe-driven-design
    depends_on: [e0-bootstrap]
  - id: e9-coal-feeds-iron
    depends_on: [e0-bootstrap]

