id: e5-gear
kind: composition
depends_on: [e4-steam-power]
input_save: state/saves/e4-steam-power/
goal: |
  On top of the e4 save (which has coal, iron, copper, and steam power
  running), place a NEW module `gear-production` that produces iron-gear-wheel
  using an assembling-machine-1 powered by the electric grid.

  The module needs: assembling-machine-1 (iron-plate recipe input → iron-gear-wheel output),
  coal fuel (routed from existing coal-burner-cell output, or electric if upgrading),
  and iron-plate input (routed from existing iron-smelt-line output).

  Sustain a net iron-gear-wheel production rate of at least 0.05/s for one minute.

  Why this epoch: validates that the system can chain modules together —
  the gear producer depends on iron plates from e2 and power from e4.
  The Designer must author the gear-production module (allow_module_creation).
allow_module_creation: true
target_metric:
  audit: lib/audits/throughput-window.lua
  params:
    item: iron-gear-wheel
    min_rate_per_s: 0.05
    window_ticks: 3600
allowed_modules:
  - gear-production    # NOT in lib/ at run start — Designer must author it
budgets:
  probe_timeout_ms: 600000
  design_timeout_ms: 600000
  execute_timeout_ms: 600000
output_save: state/saves/e5-gear/
