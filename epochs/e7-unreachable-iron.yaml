id: e7-unreachable-iron
kind: composition
depends_on: [e0-bootstrap]
input_save: state/saves/e0-bootstrap-v1.zip
recovery_attempts: 3   # NEW — orchestrator will retry design+execute+audit up
                       # to 3 times before giving up. probe runs once and is
                       # cached; world resets to input_save before each retry.
goal: |
  Stress-test the all-attempts-fail recovery path with a TARGET ITEM that
  the allowed module physically cannot produce. coal-burner-cell extracts
  coal; we ask audit to measure iron-ore throughput. The Designer can read
  the previousAttempts feedback all it wants, but with allowed_modules
  constrained to coal-burner-cell there is NO substitution that produces
  iron-ore. Every audit will measure 0 ore/s, no matter how many cells are
  placed or where. Expected outcome: ok=false after 3 attempts.

  This validates:
    (a) epoch.js winning=null branch returns cleanly without throwing
    (b) writeDigest tolerates pass=false verdicts
    (c) lib/modules/ stays unchanged (no false promotion of staged modules)
    (d) run-meta.json + summary.md render fail-only runs correctly
    (e) attempts return shape is uniformly {attempts: <number>,
        attemptsDetail: [...]} on the failure path

  Contrast with e6 (which is reachable via replication and converges to
  pass=true at attempt 3); e7 is unreachable by construction.
target_metric:
  audit: lib/audits/throughput-window.lua
  params:
    item: iron-ore
    min_rate_per_s: 0.01
    window_ticks: 3600
allowed_modules:
  - coal-burner-cell
budgets:
  probe_timeout_ms: 600000
  design_timeout_ms: 600000
  execute_timeout_ms: 600000
output_save: state/saves/e7-unreachable-iron-v1.zip   # produced even on fail; orphan
