# coal-cluster-cell
#
# Two burner-mining-drills on one coal patch feed a shared south-running belt
# spine. Each drill self-fuels from the shared belt, and one burner inserter
# lifts surplus coal into a single output chest.
id: coal-cluster-cell
version: 1

inputs: []
outputs:
  - { name: coal_belt, side: south, rel_pos: [2.5, 0.5], throughput: 0.45, item: coal, kind: belt }

power: { kind: burner, fuel: coal, self_sufficient: true }

# Bounding box of all entity tiles, anchor-relative. Anchor is the southern
# burner-mining-drill center; a second drill is centered two tiles north.
footprint:
  min: [-1.5, -3.5]
  max: [5.0, 1.5]

preconditions:
  - kind: resource_patch
    resource: coal
    min_tiles: 18
    description: "two burner-mining-drill footprints must overlap coal patch tiles"

realization:
  blueprint: lib/blueprints/coal-cluster-cell.json
  starter_fuel:
    - { item: coal, count: 11 }

meters:
  - id: coal-cluster-cell-throughput
    script: lib/meters/throughput-window.lua
    params: { item: coal, min_rate_per_s: 0.40, window_ticks: 3600 }
