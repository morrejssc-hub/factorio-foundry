# gear-production
#
# assembling-machine-1 crafts iron-gear-wheel from iron-plates.
# Anchor = assembling-machine-1 center.
#
# Input: iron-plate via transport-belt on west side (dx=-3).
# Burner-inserter at dx=-2 picks plates from belt and feeds assembler.
#
# Output: burner-inserter at dx=+2 lifts gears from assembler output
# into an iron-chest at dx=+4 on the east side.
#
# Power: small-electric-pole at dy=-2 must connect to the existing
# electric grid (supplied by steam-power-line or similar).
# Inserters are burner-powered (self-fuelled via settings.fuel).

id: gear-production
version: 1

inputs:
  - { name: iron_plate_in, side: west, rel_pos: [-3, 0], throughput: 0.5, item: iron-plate, kind: belt }

outputs:
  - { name: gear_chest, side: east, rel_pos: [4, 0], throughput: 0.5, item: iron-gear-wheel, kind: inventory }

power: { kind: electric }

# Assembler 3x3 at (0,0): x -1.5..1.5, y -1.5..1.5
# Power pole 1x1 at (0,-2): y -2.5..-1.5
# Input belt 1x1 at (-3,0): x -3.5..-2.5
# Gear chest 1x1 at (4,0): x 3.5..4.5
footprint:
  min: [-3.5, -2.5]
  max: [4.5, 1.5]

realization:
  blueprint: lib/blueprints/gear-production.json

meters:
  - id: gear-production-throughput
    script: lib/meters/throughput-window.lua
    params: { item: iron-gear-wheel, min_rate_per_s: 0.05, window_ticks: 3600 }
