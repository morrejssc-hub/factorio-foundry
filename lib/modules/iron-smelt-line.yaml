# iron-smelt-line
#
# Burner mining drill on an iron-ore patch drops ore directly into an adjacent
# 2x2 stone furnace; an inserter east of the furnace lifts iron-plate output
# into a chest.
#
# Coal input: a transport-belt stub runs east along the south edge (y=+2.5).
# Two burner-inserters pick coal from that belt and drop it into the drill and
# furnace fuel slots respectively (direction=south → picks from south, drops
# north). Connect the coal_in port to a coal source via plan.yaml connections.
#
# Steady-state output: drill-bottlenecked (~0.25 ore/s → ~0.20 plate/s after
# inserter overhead).
id: iron-smelt-line
version: 2

inputs:
  - { name: coal_in, side: south, rel_pos: [-0.5, 2.5], throughput: 0.36, item: coal, kind: belt }

outputs:
  - { name: iron_plate_chest, side: east, rel_pos: [4.5, 0.5], throughput: 0.20, item: iron-plate, kind: inventory }

power: { kind: burner, fuel: coal, self_sufficient: false }

# Anchor-relative bounding box.
# Drill 2x2 at (0,0) top edge y=-1; furnace 2x2 at (2,0) same.
# South edge: belt stubs at y=2.5 → max y = 3.0.
footprint:
  min: [-1.0, -1.0]
  max: [5.0, 3.0]

preconditions:
  - kind: resource_patch
    resource: iron-ore
    min_tiles: 4
    description: "drill 2x2 footprint must overlap an iron-ore patch covering at least the drill area"

realization:
  blueprint: lib/blueprints/iron-smelt-line.json
  starter_fuel:
    - { item: coal, count: 30 }   # drill:10 furnace:5 output_inserter:5 fuel_inserters:5+5

meters:
  - id: iron-smelt-line-throughput
    script: lib/meters/throughput-window.lua
    params: { item: iron-plate, min_rate_per_s: 0.05, window_ticks: 3600 }
